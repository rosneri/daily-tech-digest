[project]
name = "digest-cli"
version = "0.2.0"
description = "The daily tech digest CLI: the only client of the libs."
requires-python = ">=3.11"
dependencies = [
    "digest-shellenv",
    "digest-slack",
    "digest-compose",
    "digest-launchd",
    "digest-horizon",
    "digest-podcast",
]

[project.scripts]
digest = "digest_cli.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest_cli"]

[tool.uv.sources]
digest-shellenv = { workspace = true }
digest-slack = { workspace = true }
digest-compose = { workspace = true }
digest-launchd = { workspace = true }
digest-horizon = { workspace = true }
digest-podcast = { workspace = true }
